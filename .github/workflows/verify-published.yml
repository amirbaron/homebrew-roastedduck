name: Verify public bottles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d
      - name: Install the public bottle and test search
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          brew install --force-bottle amirbaron/roastedduck/roastedduck
          brew info --json=v2 amirbaron/roastedduck/roastedduck > installed.json
          python3 -c 'import json; d=json.load(open("installed.json"))["formulae"][0]["installed"][0]; assert d["poured_from_bottle"], d'
          brew test amirbaron/roastedduck/roastedduck 2>&1 | tee package-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-bottle-${{ matrix.os }}
          path: |
            installed.json
            package-test.log
